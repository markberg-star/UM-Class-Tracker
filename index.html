<head>

<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark">HQ</span>
        <span class="brand-text"><span class="eyebrow-light">Miami Herbert</span><strong>Herbert HQ</strong></span>
      </a>
      <nav class="sidenav-links" aria-label="Primary">
        <a data-nav="/" href="#/">Dashboard</a>
        <a data-nav="/calendar" href="#/calendar">Calendar</a>
        <a data-nav="/whatif" href="#/whatif">What-If</a>
        <a data-nav="/gpa" href="#/gpa">GPA</a>
        <a data-nav="/todos" href="#/todos">To-Dos</a>
        <a data-nav="/import" href="#/import">Import</a>
        <a data-nav="/settings" href="#/settings">Settings</a>
      </nav>
    </header>

    <main id="app" aria-live="polite">
      <div class="page"><p class="caption">Loading your semester…</p></div>
    </main>

    <script>
    // Boot guard (plain script, runs everywhere): if the module app fails to
    // start, explain why on screen instead of leaving dead buttons.
    (function () {
      var booted = false;
      window.__hqBooted = function () { booted = true; };
      function fail(title, hints) {
        var app = document.getElementById('app');
        if (!app || booted) return;
        app.innerHTML =
          '<div style="max-width:560px;margin:40px auto;padding:24px;background:#fff;border:1px solid #D8DCDA;border-top:4px solid #F47321;font-family:system-ui,sans-serif">' +
          '<h2 style="font-family:Georgia,serif;color:#005030;margin:0 0 12px">' + title + '</h2>' +
          hints.map(function (h) { return '<p style="font-size:14px;line-height:1.55;margin:0 0 10px">' + h + '</p>'; }).join('') +
          '</div>';
      }
      window.__hqBootFail = fail;
      if (location.protocol === 'file:') {
        var show = function () {
          fail('Almost there — the app needs a web server', [
            'You opened <code>index.html</code> directly from your files (the address bar starts with <code>file://</code>). Browsers block app code on file:// pages, so nothing can run — that’s why no buttons work.',
            '<strong>Fix (local):</strong> open Terminal, run <code>cd "' + '<i>path to the app folder</i>' + '" && python3 -m http.server 8080</code>, then go to <code>http://localhost:8080</code>.',
            '<strong>Fix (online):</strong> push the folder to GitHub and turn on GitHub Pages (steps in README.md), then use the <code>https://&hellip;github.io/&hellip;</code> link.',
          ]);
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
        return;
      }
      setTimeout(function () {
        if (booted) return;
        fail('Herbert HQ didn’t start', [
          'The page loaded but the app code didn’t. The usual causes:',
          '• <strong>Files not at the repository root.</strong> On GitHub, <code>index.html</code>, the <code>js/</code> folder, and the <code>css/</code> folder must sit at the top level of the repo — not inside a subfolder like “UM class tracker deliverable”.',
          '• <strong>No internet on first load.</strong> One library loads from a CDN the first time; connect and refresh. After that it works offline.',
          '• <strong>An old cached version.</strong> Hard-refresh (Cmd/Ctrl+Shift+R), or on iPhone: Settings → Safari → Clear History and Website Data for this site.',
          'Open the browser console (F12 → Console) and look for red errors — the first one names the file that failed.',
        ]);
      }, 6000);
    })();
    </script>

    <nav class="tabbar" aria-label="Primary mobile">

      <a data-nav="/calendar" href="#/calendar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg><span>Calendar</span></a>
      <a data-nav="/whatif" href="#/whatif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg><span>What-If</span></a>
      <a data-nav="/gpa" href="#/gpa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg><span>GPA</span></a>
      <a data-nav="/more" href="#/more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg><span>More</span></a>
    </nav>
